[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "jayai"
version = "0.25.0"
requires-python = ">=3.11,<3.14"
dependencies = ["fastapi==0.115.8", "uvicorn==0.34.0", "pydantic==2.10.6", "psycopg[binary]==3.2.4", "jsonschema==4.23.0", "cryptography==44.0.1", "httpx==0.28.1", "redis==5.2.1"]

[project.optional-dependencies]
test = ["pytest==8.3.4", "httpx==0.28.1", "redis==5.2.1"]
browser = ["playwright==1.57.0"]

[tool.setuptools.packages.find]
include = ["jayai*", "migrations*"]

[tool.setuptools.package-data]
jayai = ["dashboard.html", "music.html"]
migrations = ["*.sql"]
